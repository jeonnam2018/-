<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 감염병대응 유형 테스트</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  font-family: "Pretendard", "Noto Sans KR", sans-serif;
  background: #f6f8fb;
  margin: 0;
  padding: 20px;
  color: #222;
}
.container {
  max-width: 760px;
  margin: 0 auto;
  background: #fff;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
h1 {
  text-align: center;
  color: #1f4e79;
}
.intro {
  text-align: center;
  color: #555;
  margin-bottom: 28px;
}
.question {
  margin-bottom: 24px;
  padding: 18px;
  border: 1px solid #e1e6ef;
  border-radius: 14px;
  background: #fafcff;
}
label {
  display: block;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  background: #fff;
  border: 1px solid #ddd;
  cursor: pointer;
}
button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background: #1f78d1;
  border: none;
  border-radius: 14px;
  cursor: pointer;
}
#result {
  display: none;
  margin-top: 30px;
  padding: 26px;
  border-radius: 18px;
  background: #f0f7ff;
  border: 2px solid #1f78d1;
  text-align: center;
}
#result h2 {
  color: #1f4e79;
  font-size: 28px;
}
.result-img {
  width: 260px;
  max-width: 90%;
  margin: 24px auto;
  display: block;
  border-radius: 24px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
#captureArea {
  background: #f0f7ff;
  padding: 24px;
  border-radius: 18px;
}
.save-guide {
  font-size: 14px;
  color: #555;
  margin-top: 12px;
}
</style>
</head>

<body>
<div class="container">
  <h1 id="mainTitle">🦠 나의 감염병대응 유형 테스트</h1>
  <p class="intro">10문항에 답하고 나의 감염병 캐릭터 유형을 확인해보세요!</p>

  <form id="quizForm"></form>

  <button id="resultButton" type="button" onclick="showResult()">결과 보기</button>

  <div id="result"></div>
</div>

<script>
const questions = [
  {
    text: "회의 시작 5분 전, 아직 준비가 덜 됐다면?",
    answers: [
      { text: "일단 시작하면서 해결한다", type: "노로바이러스형" },
      { text: "체크리스트 다시 확인한다", type: "역학조사관형" },
      { text: "조용히 상황을 관찰한다", type: "결핵형" },
      { text: "주변 사람들 도와준다", type: "백신형" }
    ]
  },
  {
    text: "감염병 의심 신고가 들어왔다!",
    answers: [
      { text: "바로 현장 출동", type: "홍역형" },
      { text: "자료부터 수집", type: "역학조사관형" },
      { text: "상급기관 먼저 보고", type: "백신형" },
      { text: "일단 커피 한 잔…", type: "결핵형" }
    ]
  },
  {
    text: "당신의 PPE 착용 스타일은?",
    answers: [
      { text: "완벽하게 FM대로", type: "CRE형" },
      { text: "중요한 것만 빠르게", type: "노로바이러스형" },
      { text: "늘 누가 도와줘야 함", type: "백신형" },
      { text: "벗을 때 더 긴장함", type: "역학조사관형" }
    ]
  },
  {
    text: "워크숍 쉬는 시간의 나는?",
    answers: [
      { text: "여기저기 돌아다님", type: "홍역형" },
      { text: "아는 사람들과 대화", type: "노로바이러스형" },
      { text: "조용히 앉아있음", type: "결핵형" },
      { text: "간식 코너 탐색", type: "CRE형" }
    ]
  },
  {
    text: "가장 자신 있는 감염관리 능력은?",
    answers: [
      { text: "빠른 상황 대응", type: "홍역형" },
      { text: "자료 정리·분석", type: "역학조사관형" },
      { text: "꼼꼼한 환경관리", type: "CRE형" },
      { text: "사람들과 협업", type: "백신형" }
    ]
  },
  {
    text: "손위생 교육을 한다면?",
    answers: [
      { text: "몸으로 직접 보여준다", type: "홍역형" },
      { text: "데이터로 설명한다", type: "역학조사관형" },
      { text: "반복 훈련시킨다", type: "CRE형" },
      { text: "재미있게 게임화한다", type: "노로바이러스형" }
    ]
  },
  {
    text: "유행 발생 시 나의 역할은?",
    answers: [
      { text: "현장 지휘관", type: "홍역형" },
      { text: "역학조사관", type: "역학조사관형" },
      { text: "실험실 분석관", type: "CRE형" },
      { text: "분위기 메이커", type: "노로바이러스형" }
    ]
  },
  {
    text: "나와 가장 가까운 표현은?",
    answers: [
      { text: "빨리 움직이자!", type: "홍역형" },
      { text: "근거가 중요해.", type: "역학조사관형" },
      { text: "확실할 때까지 본다.", type: "결핵형" },
      { text: "일단 재밌게!", type: "노로바이러스형" }
    ]
  },
  {
    text: "쉬는 시간 줄이 길다면?",
    answers: [
      { text: "다른 부스 먼저 감", type: "노로바이러스형" },
      { text: "왜 줄 긴지 분석", type: "역학조사관형" },
      { text: "기다리면서 관찰", type: "결핵형" },
      { text: "줄 선 사람과 친해짐", type: "홍역형" }
    ]
  },
  {
    text: "감염병 영화 속 내 역할은?",
    answers: [
      { text: "최초 대응팀", type: "홍역형" },
      { text: "브레인 분석팀", type: "역학조사관형" },
      { text: "끝까지 살아남는 생존형", type: "결핵형" },
      { text: "모두를 지키는 지원군", type: "백신형" }
    ]
  }
];

const descriptions = {
  "홍역형": "전파력과 존재감이 강한 행동파입니다. 추진력이 좋고 현장 대응에 강합니다.",
  "노로바이러스형": "빠르고 에너지 넘치는 분위기 메이커입니다. 어디서든 참여도가 높습니다.",
  "결핵형": "조용하지만 끈기 있는 관찰형입니다. 신중하고 쉽게 흔들리지 않습니다.",
  "CRE형": "환경 적응력이 뛰어난 실무형입니다. 꼼꼼하고 위기 상황에서도 잘 버팁니다.",
  "백신형": "주변을 보호하고 협업을 잘하는 안정형입니다. 팀 전체의 균형을 잡아줍니다.",
  "역학조사관형": "근거와 분석을 중시하는 전략형입니다. 상황 파악과 판단력이 뛰어납니다."
};

const emojis = {
  "홍역형": "🔥",
  "노로바이러스형": "⚡",
  "결핵형": "🕵️",
  "CRE형": "🧫",
  "백신형": "🛡️",
  "역학조사관형": "📊"
};

const images = {
  "홍역형": "images/measles.png",
  "노로바이러스형": "images/norovirus.png",
  "결핵형": "images/tb.png",
  "CRE형": "images/cre.png",
  "백신형": "images/vaccine.png",
  "역학조사관형": "images/epi.png"
};

const form = document.getElementById("quizForm");

questions.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "question";

  let html = `<h3>Q${i + 1}. ${q.text}</h3>`;

  q.answers.forEach(answer => {
    html += `
      <label>
        <input type="radio" name="q${i}" value="${answer.type}">
        ${answer.text}
      </label>
    `;
  });

  div.innerHTML = html;
  form.appendChild(div);
});

function showResult() {
  const scores = {
    "홍역형": 0,
    "노로바이러스형": 0,
    "결핵형": 0,
    "CRE형": 0,
    "백신형": 0,
    "역학조사관형": 0
  };

  for (let i = 0; i < questions.length; i++) {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);

    if (!selected) {
      alert("모든 문항에 답해주세요!");
      return;
    }

    scores[selected.value]++;
  }

  const topType = Object.keys(scores).reduce((a, b) =>
    scores[a] >= scores[b] ? a : b
  );

  document.getElementById("quizForm").style.display = "none";
  document.getElementById("resultButton").style.display = "none";
  document.querySelector(".intro").style.display = "none";
  document.getElementById("mainTitle").style.display = "none";

  const resultDiv = document.getElementById("result");
  resultDiv.style.display = "block";

  resultDiv.innerHTML = `
    <div id="captureArea">
      <h2>${emojis[topType]} 당신은 ${topType}!</h2>

      <img
        class="result-img"
        src="${images[topType]}"
        alt="${topType} 이미지"
        onerror="this.style.display='none';"
      >

      <p style="font-size:18px; line-height:1.7; margin-top:20px;">
        ${descriptions[topType]}
      </p>

      <p style="font-size:14px; color:#555; margin-top:18px;">
        🦠 나의 감염병대응 유형 테스트
      </p>
    </div>

    <button type="button" onclick="saveResultImage()" style="margin-top:25px; background:#ff6b8a;">
      📸 결과 저장하기
    </button>

    <p class="save-guide">
      휴대폰에서는 공유창이 열리며, 사진 앱 또는 카카오톡 등으로 저장·공유할 수 있습니다.
    </p>

    <button type="button" onclick="location.reload()" style="margin-top:12px; background:#555;">
      다시 테스트하기
    </button>
  `;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function saveResultImage() {
  const captureArea = document.getElementById("captureArea");

  const canvas = await html2canvas(captureArea, {
    backgroundColor: "#f0f7ff",
    scale: 2,
    useCORS: true
  });

  canvas.toBlob(async function(blob) {
    const file = new File([blob], "나의_감염병대응_유형_테스트.png", {
      type: "image/png"
    });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "나의 감염병대응 유형 테스트",
          text: "나의 감염병대응 유형 결과를 확인해보세요!"
        });
      } catch (error) {
        downloadImage(blob);
      }
    } else {
      downloadImage(blob);
    }
  });
}

function downloadImage(blob) {
  const link = document.createElement("a");
  link.download = "나의_감염병대응_유형_테스트.png";
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
